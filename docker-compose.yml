services:
  quotation-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "102:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: file:/app/data/quotation.db
      TEMPLATE_DIR: /app/templates
      STORAGE_DIR: /app/storage
    volumes:
      - quotation_data:/app/data
      - quotation_storage:/app/storage
    restart: unless-stopped
    init: true

volumes:
  quotation_data:
  quotation_storage:
